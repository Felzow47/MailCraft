[package]
name = "mailcraft"
description = "MailCraft - visionneuse de messages Outlook (.msg)"
version = "0.2.2"
edition = "2021"
license = "MIT"

[[bin]]
name = "mailcraft"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
resvg = "0.45"
cfb = "0.15"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
raw-window-handle = "0.6"
rfd = "0.17"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sys-locale = "0.3"
env_logger = { version = "0.11", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
